<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom URL Password Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 28px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .clock-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .pass-box {
            background: #090d16;
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 24px 16px;
            margin-bottom: 16px;
            position: relative;
        }

        .pass-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .password-display {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 6px;
            color: #ffffff;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .btn-copy {
            background: var(--accent);
            color: #04101e;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .btn-copy:hover {
            background: var(--accent-hover);
        }

        .btn-copy.copied {
            background: var(--success);
            color: #ffffff;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 20px;
            font-size: 13px;
            text-align: left;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .meta-item .label {
            color: var(--text-sub);
            font-size: 11px;
            text-transform: uppercase;
        }

        .meta-item .val {
            font-weight: 600;
            font-family: monospace;
            color: #e2e8f0;
        }

        .next-hour-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 14px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Custom URL Password</h1>
    <p class="subtitle">Live Time-Locked 8-Digit OTP</p>

    <div class="clock-badge">
        <span>🕒 IST Live:</span>
        <strong id="ist-clock">--:--:--</strong>
    </div>

    <div class="pass-box">
        <div class="pass-label">Current Valid Password</div>
        <div class="password-display" id="current-pass">--------</div>
        <button class="btn-copy" id="copy-btn" onclick="copyPassword()">Copy Password</button>
    </div>

    <div class="meta-info">
        <div class="meta-item">
            <span class="label">Time Remaining</span>
            <span class="val" id="time-remaining">--m --s</span>
        </div>
        <div class="meta-item" style="text-align: right;">
            <span class="label">Time Payload</span>
            <span class="val" id="time-payload">YYYYMMDDHH</span>
        </div>
    </div>

    <div class="next-hour-card">
        <span style="color: var(--text-sub);">Next Hour Password:</span>
        <strong id="next-pass" style="font-family: monospace; letter-spacing: 1px; color: var(--accent);">--------</strong>
    </div>
</div>

<script>
    const SECRET_KEY = "my_secratekey_for_dailypass1109";

    // Helper: calculate 8-digit password for given YYYYMMDDHH string
    async function calculatePassword(timeString) {
        const enc = new TextEncoder();
        const keyData = enc.encode(SECRET_KEY);
        const msgData = enc.encode(timeString);

        const cryptoKey = await crypto.subtle.importKey(
            "raw",
            keyData,
            { name: "HMAC", hash: { name: "SHA-256" } },
            false,
            ["sign"]
        );

        const signature = await crypto.subtle.sign("HMAC", cryptoKey, msgData);
        const view = new DataView(signature);
        const bigIntVal = view.getBigInt64(0, false); // big-endian 64-bit
        const masked = bigIntVal & 0x7FFFFFFFFn;
        const passwordNum = masked % 100000000n;
        return passwordNum.toString().padStart(8, '0');
    }

    // Helper: get IST Date object (UTC + 5 hours 30 mins)
    function getISTDate(date = new Date()) {
        const utcMs = date.getTime() + (date.getTimezoneOffset() * 60000);
        return new Date(utcMs + (5.5 * 3600000));
    }

    function formatTimeString(istDate) {
        const y = istDate.getFullYear();
        const m = String(istDate.getMonth() + 1).padStart(2, '0');
        const d = String(istDate.getDate()).padStart(2, '0');
        const h = String(istDate.getHours()).padStart(2, '0');
        return `${y}${m}${d}${h}`;
    }

    let lastTimeString = "";

    async function updateDisplay() {
        const now = new Date();
        const istNow = getISTDate(now);

        // Format IST live clock
        const hh = String(istNow.getHours()).padStart(2, '0');
        const mm = String(istNow.getMinutes()).padStart(2, '0');
        const ss = String(istNow.getSeconds()).padStart(2, '0');
        document.getElementById('ist-clock').textContent = `${hh}:${mm}:${ss}`;

        // Remaining time in current hour
        const remainingMinutes = 59 - istNow.getMinutes();
        const remainingSeconds = 59 - istNow.getSeconds();
        document.getElementById('time-remaining').textContent = `${remainingMinutes}m ${remainingSeconds}s`;

        const currentTimeString = formatTimeString(istNow);

        // Recompute passwords when hour rolls over
        if (currentTimeString !== lastTimeString) {
            lastTimeString = currentTimeString;
            document.getElementById('time-payload').textContent = currentTimeString;

            // Current hour password
            const currentPass = await calculatePassword(currentTimeString);
            document.getElementById('current-pass').textContent = currentPass;

            // Next hour password
            const istNext = new Date(istNow.getTime() + 3600000);
            const nextTimeString = formatTimeString(istNext);
            const nextPass = await calculatePassword(nextTimeString);
            document.getElementById('next-pass').textContent = nextPass;
        }
    }

    function copyPassword() {
        const pass = document.getElementById('current-pass').textContent;
        if (!pass || pass.includes('-')) return;

        navigator.clipboard.writeText(pass).then(() => {
            const btn = document.getElementById('copy-btn');
            const originalText = btn.textContent;
            btn.textContent = "Copied to Clipboard!";
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('copied');
            }, 1800);
        });
    }

    updateDisplay();
    setInterval(updateDisplay, 1000);
</script>

</body>
</html>
